name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Verify required governance files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            AGENTS.md
            CONTRIBUTING.md
            LICENSE
            SECURITY.md
            .github/CODEOWNERS
            .github/PULL_REQUEST_POLICY.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/dependabot.yml
            .github/RULESET.md
            .github/rulesets/main.json
            .coderabbit.yaml
            .greptile/config.json
            .greptile/rules.md
            .greptile/files.json
          )
          for file in "${required_files[@]}"; do
            test -f "$file"
          done

      - name: Check whitespace errors
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          ruby -e "require 'yaml'; YAML.safe_load(File.read('.coderabbit.yaml'), aliases: true)"
          jq empty .github/rulesets/main.json
          jq empty .greptile/config.json
          jq empty .greptile/files.json

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run available quality scripts
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "No root package.json yet; skipping application quality scripts."
            exit 0
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm run build
          pnpm run test:unit
          pnpm run test:rules
          pnpm run test:integration
          pnpm run test:ws
          pnpm run test:sim -- --seed 20260821

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run Playwright E2E
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
