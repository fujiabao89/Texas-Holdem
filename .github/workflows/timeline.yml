name: Timeline release gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/timeline.yml'
      - 'tests/e2e/real/timeline/**'
      - 'tests/e2e/playwright.timeline.config.ts'
  workflow_dispatch:
    inputs:
      sha:
        description: "完整候选提交 SHA（TEX-30/43/56 发布证据）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: timeline-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  timeline-rc:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'timeline-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tex_test
          POSTGRES_PASSWORD: tex_test_pw
          POSTGRES_DB: tex_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Validate immutable candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run complete RC gate (20 cases, no retries)
        env:
          TEX_TEST_DATABASE_URL: postgres://tex_test:tex_test_pw@127.0.0.1:55432/tex_e2e
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
          xvfb-run -a pnpm test:e2e:timeline:rc
      - name: Audit candidate evidence before upload
        if: always()
        id: timeline_audit
        run: pnpm exec tsx tests/e2e/real/timeline/audit.ts
      - name: Upload sanitized candidate evidence
        if: always() && steps.timeline_audit.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timeline-rc-${{ inputs.sha }}
          path: tests/e2e/.artifacts-timeline
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
