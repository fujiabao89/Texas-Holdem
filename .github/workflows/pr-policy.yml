name: PR Policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-and-pr-policy:
    name: branch-and-pr-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch, Linear-style title, and Linear reference
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTOR" == "dependabot[bot]" || "$BRANCH" == dependabot/* ]]; then
            echo "Dependabot PR: skipping Linear naming policy."
            exit 0
          fi

          pattern='^(feat|fix|chore|docs|refactor|test|hotfix)/TEX-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "Invalid branch: $BRANCH"
            echo "Expected: <type>/TEX-<number>-<kebab-case-summary>"
            exit 1
          fi

          ticket="$(grep -oE 'TEX-[0-9]+' <<< "$BRANCH")"
          title_pattern="^\\[${ticket}\\][[:space:]].+"
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must start with: [$ticket] "
            echo "Example: [$ticket] Human-readable summary"
            echo "Title: $PR_TITLE"
            exit 1
          fi

          if ! grep -Eiq "^[[:space:]]*Linear:[[:space:]]*${ticket}([^[:alnum:]-]|$)" <<< "$PR_BODY"; then
            echo "PR body must contain: Linear: $ticket"
            exit 1
          fi
