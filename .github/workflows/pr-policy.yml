name: PR Policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-and-pr-policy:
    name: branch-and-pr-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch, title, and Linear reference
        env:
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTOR" == "dependabot[bot]" || "$BRANCH" == dependabot/* ]]; then
            echo "Dependabot PR: skipping Linear naming policy."
            exit 0
          fi

          pattern='^(feat|fix|chore|docs|refactor|test|hotfix)/WEB-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "Invalid branch: $BRANCH"
            echo "Expected: <type>/WEB-<number>-<kebab-case-summary>"
            exit 1
          fi

          if [[ "$PR_TITLE" != "$BRANCH" ]]; then
            echo "PR title must exactly match the source branch."
            echo "Branch: $BRANCH"
            echo "Title:  $PR_TITLE"
            exit 1
          fi

          ticket="$(grep -oE 'WEB-[0-9]+' <<< "$BRANCH")"
          if ! grep -Eiq "Linear:[[:space:]]*${ticket}" <<< "$PR_BODY"; then
            echo "PR body must contain: Linear: $ticket"
            exit 1
          fi
