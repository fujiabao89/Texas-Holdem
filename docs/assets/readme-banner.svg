<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">River &amp; Raise — The friends' table</title>
  <desc id="desc">A deep green banner with cream lettering, two aces and orange poker chips.</desc>
  <defs>
    <linearGradient id="felt" x2="1" y2="1">
      <stop stop-color="#143B30"/>
      <stop offset="1" stop-color="#245542"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24 24 0M-6 6 6-6M18 30 30 18" stroke="#F7F4EC" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1400" height="430" rx="24" fill="url(#felt)"/>
  <rect width="1400" height="430" rx="24" fill="url(#grain)"/>
  <rect x="20" y="20" width="1360" height="390" rx="12" fill="none" stroke="#F6F2E7" stroke-opacity=".18"/>
  <circle cx="1140" cy="218" r="238" fill="none" stroke="#F6F2E7" stroke-opacity=".09"/>
  <circle cx="1140" cy="218" r="203" fill="none" stroke="#F6F2E7" stroke-opacity=".09"/>
  <g fill="#F6F2E7">
    <text x="76" y="88" font-family="Arial, sans-serif" font-size="13" letter-spacing="5">THE FRIENDS' TABLE</text>
    <text x="70" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="-4">River &amp; Raise.</text>
    <text x="77" y="263" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" opacity=".82">A little poker. A lot of good company.</text>
    <path d="M78 302H465" stroke="#C86243" stroke-width="3"/>
    <text x="77" y="357" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" opacity=".72">PRIVATE ROOMS</text>
    <circle cx="244" cy="352" r="2" opacity=".5"/>
    <text x="266" y="357" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" opacity=".72">2–10 FRIENDS</text>
    <circle cx="420" cy="352" r="2" opacity=".5"/>
    <text x="442" y="357" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" opacity=".72">PLAY CHIPS</text>
  </g>
  <g transform="translate(1042 82) rotate(14 90 125)">
    <rect x="5" y="9" width="174" height="254" rx="13" fill="#0A281F" opacity=".3"/>
    <rect width="174" height="254" rx="13" fill="#F3EDE0"/>
    <text x="18" y="42" font-family="Georgia, serif" font-size="31" fill="#C45132">A</text>
    <text x="16" y="70" font-family="Georgia, serif" font-size="26" fill="#C45132">♥</text>
    <text x="87" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="101" fill="#C45132">♥</text>
    <text x="148" y="230" text-anchor="middle" transform="rotate(180 148 220)" font-family="Georgia, serif" font-size="29" fill="#C45132">A</text>
  </g>
  <g transform="translate(922 64) rotate(-10 90 125)">
    <rect x="5" y="9" width="174" height="254" rx="13" fill="#0A281F" opacity=".3"/>
    <rect width="174" height="254" rx="13" fill="#FFFCF3"/>
    <rect x="8" y="8" width="158" height="238" rx="7" fill="none" stroke="#214D3E" stroke-opacity=".12"/>
    <text x="17" y="42" font-family="Georgia, serif" font-size="31" fill="#214D3E">A</text>
    <text x="16" y="70" font-family="Georgia, serif" font-size="26" fill="#214D3E">♠</text>
    <text x="87" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="108" fill="#214D3E">♠</text>
    <text x="148" y="230" text-anchor="middle" transform="rotate(180 148 220)" font-family="Georgia, serif" font-size="29" fill="#214D3E">A</text>
  </g>
  <g transform="translate(1200 322)">
    <ellipse cy="7" rx="56" ry="48" fill="#0A281F" opacity=".3"/>
    <circle r="50" fill="#BF5132" stroke="#F5E8CE" stroke-width="3"/>
    <circle r="42" fill="none" stroke="#F5E8CE" stroke-width="7" stroke-dasharray="9 12"/>
    <circle r="33" fill="none" stroke="#F5E8CE" stroke-width="1" opacity=".65"/>
    <text y="9" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FFF8E9">50</text>
  </g>
  <text x="1288" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="33" fill="#F6F2E7" opacity=".6">♣</text>
