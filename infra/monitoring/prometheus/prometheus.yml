# Prometheus 抓取配置（TEX-29）。阈值/保留权威：docs/06 §10.2。
# - metrics 保留 90 天经 CLI 标志 --storage.tsdb.retention.time=90d（见 docker-compose.yml）；
#   配置文件内不含 tsdb retention 键（Prometheus 配置 schema 不接受该键）。
# - game-server 目标地址与标签由部署注入（LOCAL 演练见 docker-compose.yml）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "${MONITOR_ENV:-local}"
    version: "${GAME_SERVER_VERSION:-unknown}"

rule_files:
  - /etc/prometheus/rules/game-server.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["${ALERTMANAGER_ADDR:-alertmanager:9093}"]

scrape_configs:
  - job_name: game-server
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["${GAME_SERVER_ADDR:-game-server:3001}"]
        labels:
          environment: "${MONITOR_ENV:-local}"
          version: "${GAME_SERVER_VERSION:-unknown}"
